<!DOCTYPE html>
<html>
<head>
    <title>Order Details</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#2874f0;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        tr:hover{
            background:#f1f1f1;
        }

        .back-btn{
            display:inline-block;
            margin-bottom:20px;
            padding:10px 15px;
            background:#28a745;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

<a href="/admin/orders" class="back-btn">
    ← Back To Orders
</a>

<h1>Order #{{ order_id }}</h1>

<table>

<tr>
    <th>Product Name</th>
    <th>Quantity</th>
    <th>Price</th>
</tr>

{% for item in items %}

<tr>
    <td>{{ item[0] }}</td>
    <td>{{ item[1] }}</td>
    <td>₹{{ item[2] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
